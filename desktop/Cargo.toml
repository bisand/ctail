[package]
name = "ctail-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ctail for Linux and Windows: the Rust engine under a DeniseUI front end"
publish = false

[dependencies]
ctail-core = { path = "../core" }
# DeniseUI, pinned to a revision of `main`: the published 0.19 crates predate the
# anchors, default-font, window-title and menu APIs this app is written against.
# Move to a release when one carries them.
denise = { git = "https://github.com/bisand/denise", rev = "611f8f1", features = ["std"] }
denise-render = { git = "https://github.com/bisand/denise", rev = "611f8f1" }
denise-text = { git = "https://github.com/bisand/denise", rev = "611f8f1", features = ["truetype"] }
denise-ui = { git = "https://github.com/bisand/denise", rev = "611f8f1", features = ["std", "truetype"] }
denise-winit = { git = "https://github.com/bisand/denise", rev = "611f8f1" }
arboard = { version = "3", default-features = false }
rfd = "0.15"
