[package]
name = "ctail-desktop"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "ctail for Linux and Windows: the Rust engine under a DeniseUI front end"
publish = false

[dependencies]
ctail-core = { path = "../core" }
# DeniseUI, pinned to a pushed revision of `feat/widget-scroll`: 0.20 plus the
# scroll hook the log view reports its own moves through (`EventCtx::scrolled`,
# `Painter::scroll_rows`), so a scrolled frame paints the strip that came into
# view rather than every row. Move to a release once one carries it.
denise = { git = "https://github.com/bisand/denise", rev = "dc092df", features = ["std"] }
denise-text = { git = "https://github.com/bisand/denise", rev = "dc092df", features = ["truetype"] }
denise-ui = { git = "https://github.com/bisand/denise", rev = "dc092df", features = ["std", "truetype"] }
denise-winit = { git = "https://github.com/bisand/denise", rev = "dc092df", features = ["gpu"] }
arboard = { version = "3", default-features = false }
rfd = "0.15"

# The status bar's memory readout: each platform names "what this process costs"
# differently, and none of them is a portable library call.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
