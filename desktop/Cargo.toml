[package]
name = "ctail-desktop"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "ctail for Linux and Windows: the Rust engine under a DeniseUI front end"
publish = false

[dependencies]
ctail-core = { path = "../core" }
# DeniseUI 0.21: the painter trait and the `gpu` present path, the scroll
# hook the log view reports its own moves through, and menus with submenus.
denise = { version = "0.21", features = ["std"] }
denise-text = { version = "0.21", features = ["truetype"] }
denise-ui = { version = "0.21", features = ["std", "truetype"] }
denise-winit = { version = "0.21", features = ["gpu"] }
arboard = { version = "3", default-features = false }
rfd = "0.15"

# The status bar's memory readout: each platform names "what this process costs"
# differently, and none of them is a portable library call.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
