[package]
name = "ctail-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ctail engine: polling log tailer with instant tail-first reads, rotation/truncation detection and a sparse line index"
publish = false

[lib]
name = "ctail_core"
path = "src/lib.rs"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
# Foreign-language bindings (UniFFI). Off by default so pure-Rust consumers
# (tests, benches, a future Tauri front end) don't pay for it.
ffi = ["dep:uniffi"]
# The `uniffi-bindgen` binary used to generate the Swift bindings.
cli = ["ffi", "uniffi/cli"]

[dependencies]
bytecount = "0.6"
fancy-regex = "0.19"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP for the update check and the AI providers: rustls with the
# ring provider (no cmake, no system TLS), gzip, nothing async.
ureq = "3"
uniffi = { version = "0.32", optional = true }

[dev-dependencies]
libc = "0.2"
